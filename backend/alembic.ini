[alembic]
script_location = database/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
# The database URL is resolved in migrations/env.py from core.config (absolute path),
# or can be overridden with:  alembic -x db_url=sqlite:///... upgrade head

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
